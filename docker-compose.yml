services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: basix-core-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: basix_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vault-postgres:
    build:
      context: .
      dockerfile: infra/postgres-vault/Dockerfile
    container_name: basix-vault-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: basix_vault
      VAULT_APP_USER: basix_vault_app
      VAULT_APP_PASSWORD: basix_vault_app
      PGSODIUM_KEY_FILE: /var/lib/postgresql/pgsodium/pgsodium.key
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pgsodium"
      - "-c"
      - "pgsodium.getkey_script=/usr/local/bin/pgsodium-getkey"
      - "-c"
      - "log_statement=none"
    ports:
      - "5433:5432"
    volumes:
      - vault_postgres_data:/var/lib/postgresql/data
      - vault_pgsodium_keys:/var/lib/postgresql/pgsodium

  redis:
    image: redis:7
    container_name: basix-core-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  agent-webhook:
    build:
      context: .
      dockerfile: apps/agent-engine/Dockerfile
    container_name: basix-agent-webhook
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/basix_core
      VAULT_DATABASE_URL: postgresql://basix_vault_app:basix_vault_app@vault-postgres:5432/basix_vault
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - vault-postgres

  agent-worker:
    build:
      context: .
      dockerfile: apps/agent-engine/Dockerfile
    container_name: basix-agent-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/basix_core
      VAULT_DATABASE_URL: postgresql://basix_vault_app:basix_vault_app@vault-postgres:5432/basix_vault
    command: python -m app.worker
    depends_on:
      - postgres
      - vault-postgres

volumes:
  postgres_data:
  vault_postgres_data:
  vault_pgsodium_keys:
  redis_data:
